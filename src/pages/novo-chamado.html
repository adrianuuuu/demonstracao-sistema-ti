<div class="flex-1 min-h-screen">
  <div id="header-slot"></div>

  <main class="p-8">
    <div class="max-w-3xl bg-white p-6 rounded shadow">
      <h3 class="font-semibold mb-4">Novo Chamado</h3>

      <form id="form-novo-chamado" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-sm">Tipo do Chamado *</label>
            <select id="tipo-chamado" class="w-full border rounded px-3 py-2">
              <option value="">Selecione o tipo</option>
              <option>Hardware</option>
              <option>Software</option>
              <option>Rede</option>
              <option>Impressora</option>
            </select>
          </div>
          <div>
            <label class="text-sm">Prioridade</label>
            <select id="prioridade-chamado" class="w-full border rounded px-3 py-2">
              <option>Baixa</option>
              <option selected>Média</option>
              <option>Alta</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-sm">Tombamento do Equipamento (opcional)</label>
          <input id="tombamento-equip" class="w-full border rounded px-3 py-2" placeholder="Selecione o equipamento"/>
        </div>

        <!-- <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-sm">Nome do Solicitante *</label>
            <input id="nome-solicitante" class="w-full border rounded px-3 py-2" placeholder="Digite o nome completo do solicitante"/>
          </div>
          <div>
            <label class="text-sm">Telefone de Contato *</label>
            <input id="telefone-contato" class="w-full border rounded px-3 py-2" placeholder="(99) 99999-9999"/>
          </div>
        </div>

        <div>
          <label class="text-sm">Departamento *</label>
          <select id="select-departamentos" class="w-full border rounded px-3 py-2">
            <option value="">Carregando departamentos...</option>
          </select>
        </div> -->

        <div class="space-y-2">
        <label class="text-sm font-medium text-slate-700">
          Título do Chamado
        </label>

        <input
          type="text"
          id="titulo-chamado"
          placeholder="Ex: Computador não liga"
          required
          class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>


        <div>
          <label class="text-sm">Descrição do Problema *</label>
          <textarea id="descricao-problema" rows="6" class="w-full border rounded p-3" placeholder="Descreva detalhadamente..."></textarea>
        </div>

        <div class="text-right">
          <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded">Abrir Chamado</button>
        </div>
      </form>
    </div>
  </main>
</div>
